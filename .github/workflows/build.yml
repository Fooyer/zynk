name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ubuntu-24.04 (não 22.04): o crate xcap (captura nativa de tela)
      # usa a lib libspa/PipeWire do sistema via bindgen — a versão do
      # PipeWire no 22.04 é velha demais e não tem as funções que o xcap
      # espera (erro de compilação). 24.04 tem PipeWire novo o bastante e
      # também bate com a base real dos usuários atuais (Ubuntu/Zorin 24.04).
      - name: Instala dependências do sistema (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            clang

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instala dependências do frontend
        run: npm ci

      # Disparo manual (workflow_dispatch, sem tag): só builda e sobe os
      # arquivos como artifact do run — nada de Release, que exigiria uma
      # tag de versão de verdade (github.ref_name seria "master" aqui, o
      # que não faz sentido como nome de release).
      - name: Build Tauri (sem release)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Push de uma tag "v*": builda e publica como GitHub Release
      # (rascunho) de verdade.
      - name: Build Tauri (com release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Zynk ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

      - name: Upload dos instaladores (build manual)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: zynk-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
